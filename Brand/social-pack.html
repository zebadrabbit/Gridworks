<title>Gridworks — social &amp; repo pack</title>
<style>
/* Gridworks — design tokens. Neon on void, wires on a grid.
 *
 * These are lifted from the game's own src/style.css rather than invented
 * alongside it, so the brand and the thing it is a brand for cannot drift.
 * Where a value here differs from the game, it is because the game's value
 * fails a contrast check — those are called out inline and on the brand page.
 *
 * Every ratio in a comment below is measured, not estimated: src/contrast.py
 * computes it and brand-system.html recomputes all of them live in the
 * browser, so a colour that gets nudged and quietly stops meeting AA shows up
 * as a red cell rather than as a stale comment.
 *
 * Dark ratios are against --g-void (#0A0C12), light against --g-paper
 * (#EEF3F8). "AA" means >= 4.5:1, the threshold for normal-size body text.
 */
:root {
  /* ---- ground: the void the grid sits on -------------------------------- */
  --g-void:     #0A0C12;   /* page field — the near-black everything sits on */
  --g-surface:  #0E1420;   /* raised: palette items, inspector wells */
  --g-panel:    #12202C;   /* buttons, chips, the HUD's own fills */
  --g-sunk:     #152232;   /* recessed: progress tracks, code blocks */
  --g-line:     #1D2733;   /*  1.29:1  hairlines. A border, never a text colour */
  --g-line-2:   #23445C;   /*  1.91:1  emphasised border, focus ring track */

  /* ---- ink -------------------------------------------------------------- */
  --g-ink:      #CFD8E3;   /* 13.58:1  body text */
  --g-ink-2:    #9FB0C3;   /*  8.82:1  secondary text, buffer readouts */
  --g-ink-3:    #7A8AA0;   /*  5.56:1  smallest permitted text colour — AA */
  --g-ink-4:    #5B6B80;   /*  3.59:1  LARGE ONLY (>=24px) or non-text.
                                       The game uses this at 10px for section
                                       labels; that is below AA and is the one
                                       place the kit does not follow the app. */

  /* ---- accents ---------------------------------------------------------- */
  /* Cyan is the brand. On void it is not just a graphic colour — at 11.71:1 it
     is a perfectly good text colour, which is the opposite of the usual neon
     problem. The trap is the other direction: on white it measures 1.50:1 and
     disappears. Use --g-cyan-ink whenever cyan has to sit on paper. */
  --g-cyan:      #4DD8FF;  /* 11.71:1 on void · 1.50:1 on paper — the brand */
  --g-cyan-lit:  #E8F6FF;  /* 17.74:1  the bright half of the wordmark */
  --g-cyan-ink:  #0A6A88;  /*  5.48:1 on paper — cyan as text on light ground */
  --g-cyan-deep: #1C6E8C;  /*  3.41:1 on void — wire shadow, inactive rails */
  --g-cyan-glow: #4DD8FF44;/* the 8px bloom on hover states. Decoration only */

  /* ---- signals: the three status lights --------------------------------- */
  /* Straight out of the game: every node in a factory is one of these. */
  --g-green:  #58D68D;     /* 10.63:1  running, shipped, satisfied */
  --g-amber:  #F4D03F;     /* 12.98:1  starved, throttled, needs attention */
  --g-coral:  #FF7675;     /*  7.54:1  stopped, unpowered, destructive */
  --g-seed:   #7BED9F;     /* the seed chip — a quieter green, decorative */

  /* light-ground counterparts, for the same three on a white page */
  --g-green-ink: #116B3C;  /*  5.89:1 on paper */
  --g-amber-ink: #7A5A00;  /*  5.72:1 on paper */
  --g-coral-ink: #B32B2B;  /*  5.71:1 on paper */

  /* ---- paper: the same system on a light ground -------------------------
     Not a light mode for the game — a light mode for the brand, so the mark
     survives a README, a slide and a store page. */
  --g-paper:      #EEF3F8;
  --g-paper-sunk: #DCE5EE;
  --g-paper-line: #C3D0DD;
  --g-paper-ink:  #101720;  /* 16.14:1 */
  --g-paper-ink-2:#41505F;  /*  7.41:1 */

  /* ---- type -------------------------------------------------------------
     The wordmark ships as outlines drawn on the grid, so nothing here has to
     match it. Running text is the same system stack the game uses — a browser
     game that blocks first paint on a webfont fetch would be missing the
     point, and the brand pack inherits that constraint on purpose. */
  --g-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto,
            "Helvetica Neue", Arial, sans-serif;
  --g-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono",
            "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  /* Display is the wordmark's own construction: uppercase, wide-tracked, and
     letterspaced far enough that the grid reads. Any geometric sans stands in. */
  --g-display: "Eurostile", "Michroma", "Rajdhani", var(--g-sans);

  /* Type scale — 1.25 (major third) off a 13px base, because 13px is what the
     game's HUD actually runs at and the kit should not quietly redesign it. */
  --g-t-xs:   11px;
  --g-t-sm:   13px;   /* the app's base */
  --g-t-base: 16px;
  --g-t-md:   20px;
  --g-t-lg:   25px;
  --g-t-xl:   31px;
  --g-t-2xl:  39px;
  --g-t-3xl:  49px;

  --g-lh-tight: 1.15;   /* display */
  --g-lh-snug:  1.35;   /* headings, UI */
  --g-lh-body:  1.45;   /* running text — the app's own line height */
  --g-track-display: 0.06em;   /* the wordmark is tracked OPEN, not tight */
  --g-track-label:   0.16em;   /* the 10px uppercase section labels */

  /* ---- form ------------------------------------------------------------- */
  /* Small radii. This is a machine UI: 4-6px reads engineered, anything
     rounder reads consumer app and fights the orthogonal wires. */
  --g-r-sm:  4px;
  --g-r-md:  6px;
  --g-r-lg:  10px;

  --g-tile:  32px;                   /* THE grid module — src/sim.js TILE = 32.
                                        Every spacing value here is a division
                                        of it, so brand layout and world layout
                                        are the same grid. */
  --g-space: 8px;                    /* tile / 4 */
  --g-glow-sm: 0 0 8px var(--g-cyan-glow);
  --g-glow-md: 0 0 14px #4DD8FF33;

  /* Clear space around the mark, as a multiple of its own height. Nothing —
     type, edge of canvas, another logo — comes inside this. */
  --g-mark-clearspace: 0.30;
  --g-mark-min-px: 20px;             /* below this, use the simple mark */
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--g-void); color: var(--g-ink);
  font-family: var(--g-sans); font-size: var(--g-t-base); line-height: var(--g-lh-body); }
header { padding: 40px 32px 26px; background: var(--g-surface);
  border-bottom: 1px solid var(--g-line); }
header h1 { font-size: var(--g-t-2xl); margin: 0 0 6px; font-weight: 300;
  letter-spacing: var(--g-track-display); text-transform: uppercase; color: var(--g-cyan-lit); }
header p { margin: 0; color: var(--g-ink-2); max-width: 70ch; }
header code { font-family: var(--g-mono); color: var(--g-cyan); }
main { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 30px; }
section.item { background: var(--g-surface); border: 1px solid var(--g-line);
  border-radius: var(--g-r-lg); overflow: hidden; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--g-line); background: var(--g-panel); }
.bar b { font-size: var(--g-t-sm); font-weight: 600; }
.bar code { font-family: var(--g-mono); font-size: var(--g-t-xs); color: var(--g-ink-3); }
.bar .sp { flex: 1; }
button { font: inherit; font-size: var(--g-t-xs); letter-spacing: var(--g-track-label);
  text-transform: uppercase; padding: 7px 12px; border-radius: var(--g-r-sm);
  border: 1px solid var(--g-line-2); background: var(--g-panel); color: var(--g-cyan);
  cursor: pointer; }
button:hover { background: #17324A; box-shadow: var(--g-glow-sm); }
.stage { padding: 20px; display: flex; justify-content: center;
  background: repeating-conic-gradient(var(--g-void) 0 25%, #0f141d 0 50%) 50%/22px 22px; }
.stage svg { max-width: 100%; height: auto; display: block;
  box-shadow: 0 2px 18px #000a; border-radius: 2px; }
.note { padding: 0 16px 14px; font-size: var(--g-t-sm); color: var(--g-ink-3); }
</style>
</head>

const PAL = {
  void:'#0A0C12', surface:'#0E1420', panel:'#12202C', sunk:'#152232',
  line:'#1D2733', line2:'#23445C',
  ink:'#CFD8E3', ink2:'#9FB0C3', ink3:'#7A8AA0', ink4:'#5B6B80',
  cyan:'#4DD8FF', lit:'#E8F6FF', cyanInk:'#0A6A88', deep:'#1C6E8C',
  green:'#58D68D', amber:'#F4D03F', coral:'#FF7675',
  paper:'#EEF3F8', paperInk:'#101720', paperInk2:'#41505F'
};
const SANS = "'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif";
const MONO = "'JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace";
const G = LOGO.geometry, W = LOGO.wordmark;
const TILE = ARCH.world.tile;

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---- brand primitives, all driven by the generated geometry ---- */
function markInner(fill, o) {
  o = o || {};
  let s = '';
  if (!o.simple && o.lattice) s += `<path d="${G.lattice}" fill="${o.lattice}" opacity=".55"/>`;
  if (!o.simple) s += `<path d="${G.pads}" fill="${fill}"/>`;
  s += `<path d="${G.wire}" fill="${fill}"/>`;
  if (!o.simple) {
    s += `<path d="${G.cores}" fill="${o.detail || PAL.lit}"/>`;
    s += `<circle cx="${G.hub.cx}" cy="${G.hub.cy}" r="${G.hub.r}" fill="${o.detail || PAL.lit}"/>`;
  }
  return s;
}
function mark(x, y, size, fill, o) {
  return `<g transform="translate(${x},${y}) scale(${size / 100})">${markInner(fill, o)}</g>`;
}
function word(x, y, size, gridFill, worksFill) {
  const k = size / W.cap;
  return `<g transform="translate(${x},${y}) scale(${k})">`
    + `<path d="${W.grid}" fill="${gridFill}"/><path d="${W.works}" fill="${worksFill}"/></g>`;
}
const wordWidth = size => W.width * size / W.cap;

/* Horizontal lockup, returned with its measured width so callers can centre it. */
function lockup(x, y, size, gridFill, worksFill, markFill, o) {
  const ms = size * 1.55, gap = size * 0.42, w = ms + gap + wordWidth(size);
  return {
    svg: mark(x, y, ms, markFill, o)
       + word(x + ms + gap, y + ms * 0.5 + size * 0.5, size, gridFill, worksFill),
    w: w, h: ms
  };
}
function text(x, y, str, o) {
  o = o || {};
  return `<text x="${x}" y="${y}" fill="${o.fill || PAL.ink}" font-family="${o.mono ? MONO : SANS}"`
    + ` font-size="${o.size || 20}" font-weight="${o.weight || 400}"`
    + (o.spacing ? ` letter-spacing="${o.spacing}"` : '')
    + (o.anchor ? ` text-anchor="${o.anchor}"` : '') + `>${esc(str)}</text>`;
}
function rect(x, y, w, h, fill, r, stroke, sw) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"`
    + (r ? ` rx="${r}"` : '') + (stroke ? ` stroke="${stroke}" stroke-width="${sw || 1}"` : '') + '/>';
}
/* The one repeating motif in the system: the world grid, at the world's own
   tile size. Every background below is on it. */
function worldGrid(w, h, colour, op, step) {
  step = step || TILE;
  let d = '';
  for (let x = step; x < w; x += step) d += `M ${x} 0 L ${x} ${h} `;
  for (let y = step; y < h; y += step) d += `M 0 ${y} L ${w} ${y} `;
  return `<path d="${d}" stroke="${colour}" stroke-width="1" opacity="${op}" fill="none"/>`;
}
/* A run of wire with a node at each end — the game's core gesture. */
function wire(pts, colour, w, node) {
  w = w || 3; node = node == null ? 6 : node;
  const d = 'M ' + pts.map(p => p[0] + ' ' + p[1]).join(' L ');
  return `<path d="${d}" stroke="${colour}" stroke-width="${w}" fill="none"`
    + ` stroke-linecap="round" stroke-linejoin="round"/>`
    + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${node}" fill="${colour}"/>`).join('');
}

/* ---------------------------------------------------------------- render */
const svgOf = c =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${c.w}" height="${c.h}" viewBox="0 0 ${c.w} ${c.h}">${c.render()}</svg>`;

function download(name, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function saveSVG(c) {
  download(c.id + '.svg', new Blob([svgOf(c)], { type: 'image/svg+xml' }));
}
function savePNG(c, scale) {
  const img = new Image();
  const blob = new Blob([svgOf(c)], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = c.w * scale; cv.height = c.h * scale;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => download(`${c.id}-${c.w * scale}x${c.h * scale}.png`, b));
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

const main = document.getElementById('main');
CARDS.forEach(c => {
  const sec = document.createElement('section');
  sec.className = 'item';
  sec.innerHTML =
    `<div class="bar"><b>${esc(c.label)}</b><code>${c.w}×${c.h}</code><span class="sp"></span>
       <button data-a="svg">SVG</button><button data-a="p1">PNG @1×</button><button data-a="p2">PNG @2×</button></div>
     <div class="stage">${svgOf(c)}</div>` +
    (c.note ? `<p class="note">${esc(c.note)}</p>` : '');
  sec.querySelector('[data-a="svg"]').onclick = () => saveSVG(c);
  sec.querySelector('[data-a="p1"]').onclick = () => savePNG(c, 1);
  sec.querySelector('[data-a="p2"]').onclick = () => savePNG(c, 2);
  main.appendChild(sec);
});
