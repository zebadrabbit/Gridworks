<!-- Gridworks favicon set. Paste into <head>. Paths assume /favicon/ at the site
     root; the game is served from the repo root, so copy this folder next to
     index.html and these paths work as written. -->
<link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon-180.png">
<link rel="manifest" href="favicon/site.webmanifest">
<meta name="theme-color" content="#0A0C12">

<!-- index.html currently ships an inline data: URL with a ⚡ emoji as its icon.
     Replace that line with the block above: an emoji favicon renders as whatever
     glyph the user's OS happens to have, which is a different picture on every
     platform and no picture at all on some Linux desktops. -->
